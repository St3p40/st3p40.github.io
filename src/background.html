<!DOCTYPE html>
<html>
	<head>
		<title>Background</title>
		<script>
			try {
				const savedTheme = localStorage.getItem('theme');
				if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
			} catch (e) {}
		</script>
		<style>
			:root {--layer-grade: none; --veil: transparent; --rain-ink: #14191d;}

			@media (prefers-color-scheme: dark) {
				:root:not([data-theme="light"]) {--layer-grade: brightness(0.6) saturate(0.75) contrast(1.05); --veil: rgba(13, 27, 42, 0.35); --rain-ink: #e6d0a8;}
			}

			:root[data-theme="dark"] {--layer-grade: brightness(0.6) saturate(0.75) contrast(1.05); --veil: rgba(13, 27, 42, 0.35); --rain-ink: #e6d0a8;}

			html, body {margin: 0; padding: 0; overflow: hidden; background: transparent;}

			.parallax-container {position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none;}

			.parallax-layer {filter: var(--layer-grade); position: absolute; top: 50%; left: 50%; width: 125%; height: 125%; object-fit: cover; transform: translate(-50%, -50%) scale(1.1); will-change: transform; pointer-events: none;}

			.rain-canvas {position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;}

			.night-veil {position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; background: var(--veil); pointer-events: none; transition: background 200ms;}

			@media (pointer: coarse) {
				.parallax-layer {width: 100%; height: 100%; object-fit: cover; transform: translate(-50%, -50%) scale(1);}
			}

			@media (max-width: 700px) and (orientation: portrait) {
				.parallax-layer[data-depth="3"] {display: none;}
			}
		</style>
	</head>
	<body>
		<div class="parallax-container">
			<img src="layer1.png" class="parallax-layer" data-depth="0.0" alt="" decoding="async">
			<img src="layer2.png" class="parallax-layer" data-depth="0.25" alt="" decoding="async">
			<img src="layer3.png" class="parallax-layer" data-depth="0.75" alt="" decoding="async">
			<img src="layer4.png" class="parallax-layer" data-depth="2.5" alt="" decoding="async">
			<canvas id="rain-canvas" class="rain-canvas"></canvas>
			<img src="layer5.png" class="parallax-layer" data-depth="5" alt="" decoding="async">
			<div class="night-veil"></div>
		</div>
		<script>
		(function() {
			const parallaxMouse = {x: 0, y: 0};
			const maxMove = 50;
			const frameMs = 1000 / 144;

			let parallaxTargetX = 0, parallaxTargetY = 0, centered = true;
			let appliedX = NaN, appliedY = NaN;

			let rainInk = '#14191d';

			function readRainInk() {
				const ink = getComputedStyle(document.documentElement).getPropertyValue('--rain-ink').trim();
				if (ink) rainInk = ink;
			}
			readRainInk();

			window.addEventListener('message', function(e) {
				const data = e.data;
				if (!data) return;
				if (data.type === 'theme') {
					if (data.theme === 'dark' || data.theme === 'light') document.documentElement.dataset.theme = data.theme;
					readRainInk();
				} else if (data.type === 'parallax-state') {
					parallaxTargetX = data.x;
					parallaxTargetY = data.y;
					centered = data.centered;
				}
			});

			const parallaxLayers = Array.from(document.querySelectorAll('.parallax-layer')).map(layer => ({
				el: layer,
				depth: parseFloat(layer.getAttribute('data-depth'))
			}));

			function applyParallax() {
				if (parallaxMouse.x === appliedX && parallaxMouse.y === appliedY) return;
				appliedX = parallaxMouse.x;
				appliedY = parallaxMouse.y;
				parallaxLayers.forEach(({el, depth}) => {
					const moveX = parallaxMouse.x * maxMove * depth;
					const moveY = parallaxMouse.y * maxMove * depth;
					el.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) scale(1.1)`;
				});
			}

			function easeToward(current, target, ease) {
				const next = current + (target - current) * ease;
				return Math.abs(target - next) < 0.0005 ? target : next;
			}

			function tickParallax(dt) {
				const ease = 1 - Math.pow(1 - 0.12, dt);
				parallaxMouse.x = easeToward(parallaxMouse.x, centered ? 0 : parallaxTargetX, ease);
				parallaxMouse.y = easeToward(parallaxMouse.y, centered ? 0 : parallaxTargetY, ease);
				applyParallax();
			}

			const canvas = document.getElementById('rain-canvas');
			const ctx = canvas.getContext('2d');
			let drops = [];
			let width = 0, height = 0;

			function resizeCanvas() {
				width = window.innerWidth;
				height = window.innerHeight;
				canvas.width = width;
				canvas.height = height;
				const dropCount = Math.round((width * height) / 9000);
				drops = Array.from({length: dropCount}, createDrop);
			}

			const tierAlphas = [0.18, 0.26, 0.34, 0.4];

			function createDrop() {
				return {
					x: Math.random() * width,
					y: Math.random() * height,
					length: 32 + Math.random() * 15,
					speed: 48 + Math.random() * 6,
					tier: Math.floor(Math.random() * tierAlphas.length)
				};
			}

			function respawnDrop(drop) {
				if (Math.random() < 0.9) {
					drop.x = Math.random() * width;
					drop.y = -drop.length;
				} else {
					drop.x = width + drop.length;
					drop.y = Math.random() * height;
				}
			}

			function stepDrop(drop, dt) {
				drop.y += drop.speed * dt;
				drop.x -= drop.speed * 0.25 * dt;
				if (drop.y > height || drop.x < -drop.length) {
					respawnDrop(drop);
				}
			}

			const rainDepth = 1.2;

			function renderRain(dt) {
				ctx.clearRect(0, 0, width, height);
				ctx.save();
				ctx.translate(parallaxMouse.x * maxMove * rainDepth, parallaxMouse.y * maxMove * rainDepth);
				ctx.strokeStyle = rainInk;
				ctx.lineWidth = 4;
				const tierPaths = tierAlphas.map(() => new Path2D());
				drops.forEach(drop => {
					const path = tierPaths[drop.tier];
					path.moveTo(drop.x, drop.y);
					path.lineTo(drop.x + drop.length * 0.25, drop.y - drop.length);
					stepDrop(drop, dt);
				});
				tierPaths.forEach((path, i) => {
					ctx.globalAlpha = tierAlphas[i];
					ctx.stroke(path);
				});
				ctx.globalAlpha = 1;
				ctx.restore();
			}

			let rafId = null, lastTime = 0;

			function frame(now) {
				rafId = requestAnimationFrame(frame);
				const dt = Math.min((now - lastTime) / frameMs, 3);
				lastTime = now;
				tickParallax(dt);
				renderRain(dt);
			}

			const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

			function syncMotion() {
				if (reducedMotion.matches) {
					if (rafId !== null) cancelAnimationFrame(rafId);
					rafId = null;
					ctx.clearRect(0, 0, width, height);
					parallaxMouse.x = 0;
					parallaxMouse.y = 0;
					applyParallax();
				} else if (rafId === null) {
					lastTime = performance.now();
					rafId = requestAnimationFrame(frame);
				}
			}

			let resizeTimer = null;
			window.addEventListener('resize', function() {
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(resizeCanvas, 100);
			});
			reducedMotion.addEventListener('change', syncMotion);

			resizeCanvas();
			syncMotion();
		})();
		</script>
	</body>
</html>
