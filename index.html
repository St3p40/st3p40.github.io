<!DOCTYPE html>
<html>
	<head>
		<title>St3p40</title>
		<link rel="icon" href="src/favico.ico">
		<link rel="stylesheet" href="style.css">
		<style>body { background-color: #000;}</style>
	</head>
	<body>
		<div class="desktop">
			<div class="parallax-container">
				<img src="src/layer1.png" class="parallax-layer" data-depth="0.0" alt="">
				<img src="src/layer2.png" class="parallax-layer" data-depth="0.2" alt="">
				<img src="src/layer3.png" class="parallax-layer" data-depth="0.75" alt="">
				<img src="src/layer4.png" class="parallax-layer" data-depth="1.5" alt="">
				<canvas id="rain-canvas" class="rain-canvas"></canvas>
				<img src="src/layer5.png" class="parallax-layer" data-depth="2.5" alt="">
			</div>

			<div class="activate-windows">
				<p class="activate-title">Website is under construction</p>
				<p class="activate-subtitle">Please wait idk how long</p>
			</div>

			<div id="myWindow" class="window">
				<div class="window-header">
					<span>St3P40</span>
					<button class="close-btn" onclick="closeWindow()">X</button>
				</div>
				<div class="window-body">
					<div class="avatar-container">
						<img src="src/portrait.png" alt="St3P40 Avatar" class="avatar-img">
					</div>
					<h1 class="profile-label">St3P40</h1>
					<h2 class="profile-subtitle">Hello</h2>
				</div>
			</div>
		</div>

		<div class="taskbar">
			<div id="startMenu" class="start-menu">
				<div class="start-menu-header">St3P40</div>
				<div class="start-menu-items">
					<button onclick="openWindow(); toggleStartMenu();">About Me</button>
					<button onclick="openIframeWindow('BitmapArray Tools', 'https://st3p40.win/BitmapArrayFile/'); toggleStartMenu();">BitmapArray Tools</button>
					<div class="start-menu-divider"></div>
					<a href="https://github.com/st3p40" target="_blank">GitHub Page</a>
				</div>
			</div>
			<button class="start-btn" onclick="toggleStartMenu()">Start</button>
			<div id="taskbarClock" class="taskbar-clock" title="Newfoundland time"></div>
		</div>

		<script src="script.js"></script>
	</body>
</html>
