<!DOCTYPE html>
<html>
	<head>
		<title>St3p40</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<link rel="icon" href="src/favico.ico">
		<link rel="stylesheet" href="style.css">
		<style>body { background-color: #000;}</style>
	</head>
	<body>
		<div class="desktop">
			<iframe id="background-frame" class="background-frame" src="src/background.html" aria-hidden="true" tabindex="-1"></iframe>

			<div class="activate-windows">
				<p class="activate-title">Website is under construction</p>
				<p class="activate-subtitle">Please wait idk how long</p>
			</div>

		</div>

		<div class="taskbar">
			<div id="startMenu" class="start-menu">
				<div class="start-menu-header">St3P40</div>
				<div class="start-menu-items">
					<button onclick="openIframeWindow('St3P40', 'src/about.html'); toggleStartMenu();">About Me</button>
					<button onclick="openIframeWindow('BitmapArray Tools', 'https://st3p40.win/BitmapArrayFile/'); toggleStartMenu();">BitmapArray Tools</button>
					<button onclick="openIframeWindow('LED Matrix demos', 'https://st3p40.win/Works-from-Soulmatelights/'); toggleStartMenu();">LED Matrix demos</button>
					<div class="start-menu-divider"></div>
					<div class="start-menu-divider"></div>
					<a href="https://github.com/st3p40" target="_blank">GitHub Page</a>
				</div>
			</div>
			<button class="start-btn" onclick="toggleStartMenu()">Start</button>
			<div id="taskbarWindows" class="taskbar-windows"></div>
			<div id="taskbarClock" class="taskbar-clock" title="Newfoundland time"></div>
		</div>

		<script src="script.js"></script>
		<script>
			(function() {
				const backgroundFrame = document.getElementById('background-frame');
				let lastMouseX = 0, lastMouseY = 0;
				let mouseInWindow = true;

				function sendParallaxState() {
					if (!backgroundFrame.contentWindow) return;
					const centered = hoveredIframes.size > 0 || !mouseInWindow;
					backgroundFrame.contentWindow.postMessage({type: 'parallax-state', x: lastMouseX, y: lastMouseY, centered}, '*');
				}

				document.addEventListener('mousemove', function(e) {
					lastMouseX = (e.clientX / window.innerWidth) - 0.5;
					lastMouseY = (e.clientY / window.innerHeight) - 0.5;
					sendParallaxState();
				});
				document.documentElement.addEventListener('mouseleave', () => { mouseInWindow = false; sendParallaxState(); });
				document.documentElement.addEventListener('mouseenter', () => { mouseInWindow = true; sendParallaxState(); });
				document.addEventListener('iframehoverchange', sendParallaxState);
				backgroundFrame.addEventListener('load', sendParallaxState);
			})();
		</script>
	</body>
</html>
